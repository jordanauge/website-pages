<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #2c3e50; }
      .subtitle { font: bold 16px sans-serif; fill: #34495e; }
      .label { font: 14px sans-serif; fill: #2c3e50; font-weight: bold; }
      .text { font: 13px sans-serif; fill: #555; }
      .component { font: 12px monospace; fill: #2c3e50; font-weight: bold; }
      .wire-red { stroke: #e74c3c; stroke-width: 4; fill: none; }
      .wire-black { stroke: #2c3e50; stroke-width: 4; fill: none; }
      .wire-purple { stroke: #9b59b6; stroke-width: 4; fill: none; }
      .wire-orange { stroke: #e67e22; stroke-width: 4; fill: none; }
      .box { fill: #f8f9fa; stroke: #95a5a6; stroke-width: 2; }
      .terminal { fill: #c0392b; stroke: #7f1c1c; stroke-width: 2; }
      .ic { fill: #2c3e50; stroke: #1a252f; stroke-width: 2; }
      .resistor { fill: #f4d03f; stroke: #2c3e50; stroke-width: 2; }
      .capacitor { fill: #3498db; stroke: #2c3e50; stroke-width: 2; }
      .diode { fill: #e74c3c; stroke: #2c3e50; stroke-width: 2; }
      .transistor { fill: #34495e; stroke: #2c3e50; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="title">555 Timer Doorbell Circuit - Breadboard Wiring</text>
  <text x="600" y="55" text-anchor="middle" class="subtitle">1 Hz Ring Pattern (152ms ON / 901ms OFF)</text>

  <!-- Main breadboard -->
  <rect x="50" y="100" width="1100" height="500" rx="10" class="box"/>
  
  <!-- Power rails top -->
  <text x="70" y="130" class="text">+6V</text>
  <line x1="120" y1="125" x2="1120" y2="125" class="wire-red"/>
  <text x="70" y="155" class="text">GND</text>
  <line x1="120" y1="150" x2="1120" y2="150" class="wire-black"/>

  <!-- Power rails bottom -->
  <line x1="120" y1="560" x2="1120" y2="560" class="wire-red"/>
  <line x1="120" y1="580" x2="1120" y2="580" class="wire-black"/>

  <!-- Section 1: Input (VTO2202F) -->
  <g id="input-section">
    <rect x="80" y="200" width="250" height="200" rx="5" stroke="#9b59b6" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
    <text x="205" y="225" text-anchor="middle" class="label" fill="#9b59b6">INPUT: VTO2202F</text>
    
    <!-- Terminal block -->
    <rect x="150" y="250" width="110" height="100" rx="5" fill="#34495e"/>
    <circle cx="180" cy="280" r="10" class="terminal"/>
    <text x="200" y="285" class="text" fill="#fff">Wire 1</text>
    <circle cx="180" cy="330" r="10" class="terminal"/>
    <text x="200" y="335" class="text" fill="#fff">Wire 2</text>
    
    <!-- Connections -->
    <line x1="190" y1="280" x2="280" y2="280" class="wire-purple"/>
    <text x="235" y="275" class="text">→ Pin 4</text>
    <line x1="190" y1="330" x2="280" y2="330" class="wire-red"/>
    <text x="230" y="325" class="text">→ +6V</text>
    
    <!-- Pull-down resistor annotation -->
    <text x="205" y="385" text-anchor="middle" class="text" fill="#27ae60" font-size="11">+ Pull-down 10kΩ</text>
    <text x="205" y="400" text-anchor="middle" class="text" fill="#555" font-size="10">(Pin 4 → GND)</text>
  </g>

  <!-- Section 2: 555 Timer IC -->
  <g id="ic-section">
    <rect x="400" y="200" width="350" height="300" rx="5" stroke="#2c3e50" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
    <text x="575" y="225" text-anchor="middle" class="label">555 TIMER IC + TIMING</text>
    
    <!-- IC body -->
    <rect x="480" y="280" width="140" height="180" rx="5" class="ic"/>
    <ellipse cx="550" cy="300" rx="12" ry="8" fill="#1a252f"/>
    <text x="550" y="380" text-anchor="middle" fill="#fff" class="component">TLC555</text>
    
    <!-- Pin labels (left side) -->
    <text x="470" y="315" text-anchor="end" class="text" fill="#fff">1-GND</text>
    <text x="470" y="345" text-anchor="end" class="text" fill="#fff">2-TRIG</text>
    <text x="470" y="375" text-anchor="end" class="text" fill="#fff">3-OUT</text>
    <text x="470" y="405" text-anchor="end" class="text" fill="#fff">4-RST</text>
    
    <!-- Pin labels (right side) -->
    <text x="630" y="315" class="text" fill="#fff">8-VDD</text>
    <text x="630" y="345" class="text" fill="#fff">7-DIS</text>
    <text x="630" y="375" class="text" fill="#fff">6-THR</text>
    <text x="630" y="405" class="text" fill="#fff">5-CTL</text>
    
    <!-- Timing components -->
    <rect x="650" y="250" width="60" height="25" rx="3" class="resistor"/>
    <text x="680" y="267" text-anchor="middle" class="component">R1</text>
    <text x="680" y="245" text-anchor="middle" class="text">22kΩ</text>
    
    <rect x="650" y="350" width="60" height="25" rx="3" class="resistor"/>
    <text x="680" y="367" text-anchor="middle" class="component">R2</text>
    <text x="680" y="345" text-anchor="middle" class="text">130kΩ</text>
    
    <rect x="650" y="420" width="40" height="60" rx="3" class="capacitor"/>
    <text x="670" y="455" text-anchor="middle" fill="#fff" class="component">C</text>
    <text x="670" y="495" text-anchor="middle" class="text">10µF</text>
    
    <!-- D1 diode -->
    <polygon points="655,300 685,315 655,330" class="diode"/>
    <rect x="685" y="300" width="3" height="30" fill="#2c3e50"/>
    <text x="670" y="295" text-anchor="middle" class="text">D1</text>
  </g>

  <!-- Section 3: Output Stage (Transistor) -->
  <g id="output-section">
    <rect x="800" y="200" width="320" height="300" rx="5" stroke="#e74c3c" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
    <text x="960" y="225" text-anchor="middle" class="label" fill="#e74c3c">OUTPUT: TRANSISTOR</text>
    
    <!-- Transistor -->
    <circle cx="900" cy="350" r="35" class="transistor"/>
    <line x1="890" y1="335" x2="890" y2="365" stroke="#fff" stroke-width="4"/>
    <line x1="870" y1="350" x2="890" y2="350" stroke="#fff" stroke-width="3"/>
    <line x1="890" y1="338" x2="910" y2="320" stroke="#fff" stroke-width="3"/>
    <line x1="890" y1="362" x2="910" y2="380" stroke="#fff" stroke-width="3"/>
    <polygon points="890,362 895,368 885,368" fill="#fff"/>
    
    <text x="860" y="355" class="text" fill="#fff">B</text>
    <text x="920" y="318" class="text" fill="#fff">C</text>
    <text x="920" y="388" class="text" fill="#fff">E</text>
    <text x="900" y="410" text-anchor="middle" class="component">Q1 2N2222</text>
    
    <!-- Rb resistor -->
    <rect x="820" y="342" width="50" height="18" rx="3" class="resistor"/>
    <text x="845" y="355" text-anchor="middle" class="component" font-size="10">Rb 1kΩ</text>
    
    <!-- Doorbell terminals -->
    <rect x="1000" y="280" width="90" height="120" rx="5" fill="#34495e"/>
    <text x="1045" y="270" text-anchor="middle" class="text">Doorbell</text>
    <circle cx="1030" cy="320" r="10" class="terminal"/>
    <text x="1055" y="325" class="text" fill="#fff">+</text>
    <circle cx="1030" cy="370" r="10" class="terminal"/>
    <text x="1055" y="375" class="text" fill="#fff">-</text>
    
    <!-- Flyback diode D2 -->
    <polygon points="960,310 985,322 960,334" class="diode"/>
    <rect x="985" y="310" width="3" height="24" fill="#2c3e50"/>
    <text x="972" y="305" text-anchor="middle" class="text">D2</text>
    <text x="972" y="350" text-anchor="middle" class="text" font-size="11">Flyback</text>
  </g>

  <!-- Connection lines (simplified) -->
  <!-- Power connections -->
  <line x1="550" y1="280" x2="550" y2="125" class="wire-red"/>
  
  <!-- VTO2202F wire 2 to +6V -->
  <line x1="280" y1="330" x2="280" y2="125" class="wire-red"/>
  
  <line x1="480" y1="310" x2="450" y2="310" class="wire-black"/>
  <line x1="450" y1="310" x2="450" y2="150" class="wire-black"/>
  
  <!-- Pin 4 from VTO2202F -->
  <line x1="280" y1="280" x2="350" y2="280" class="wire-purple"/>
  <line x1="350" y1="280" x2="350" y2="405" class="wire-purple"/>
  <line x1="350" y1="405" x2="480" y2="405" class="wire-purple"/>
  
  <!-- Output to transistor -->
  <line x1="620" y1="375" x2="750" y2="375" class="wire-orange"/>
  <line x1="750" y1="375" x2="750" y2="350" class="wire-orange"/>
  <line x1="750" y1="350" x2="820" y2="350" class="wire-orange"/>
  
  <!-- Transistor to doorbell -->
  <line x1="910" y1="320" x2="940" y2="320" class="wire-red"/>
  <line x1="988" y1="322" x2="1020" y2="320" class="wire-red"/>
  
  <line x1="910" y1="380" x2="910" y2="450" class="wire-black"/>
  <line x1="910" y1="450" x2="950" y2="450" class="wire-black"/>
  <line x1="950" y1="450" x2="950" y2="370" class="wire-black"/>
  <line x1="950" y1="370" x2="1020" y2="370" class="wire-black"/>

  <!-- Component list -->
  <g transform="translate(50, 630)">
    <rect x="0" y="0" width="1100" height="140" rx="5" fill="#f8f9fa" stroke="#95a5a6" stroke-width="2"/>
    <text x="550" y="25" text-anchor="middle" class="label">COMPONENT LIST</text>
    
    <g transform="translate(30, 50)">
      <text x="0" y="0" class="text">□ TLC555CP IC (CMOS timer)</text>
      <text x="0" y="20" class="text">□ R1 = 22kΩ (1/4W)</text>
      <text x="0" y="40" class="text">□ R2 = 130kΩ (1/4W)</text>
      <text x="0" y="60" class="text">□ Rb = 1kΩ, R_pd = 10kΩ (pull-down)</text>
    </g>
    
    <g transform="translate(280, 50)">
      <text x="0" y="0" class="text">□ C1 = 10µF electrolytic 16V</text>
      <text x="0" y="20" class="text">□ C2 = 10nF ceramic (pin 5)</text>
      <text x="0" y="40" class="text">□ D1 = 1N4148 (signal diode)</text>
      <text x="0" y="60" class="text">□ D2 = 1N4007 (power diode)</text>
    </g>
    
    <g transform="translate(580, 50)">
      <text x="0" y="0" class="text">□ Q1 = 2N2222 NPN transistor</text>
      <text x="0" y="20" class="text">□ Breadboard 830 points</text>
      <text x="0" y="40" class="text">□ Jumper wires (assorted)</text>
      <text x="0" y="60" class="text">□ Screw terminals (4×)</text>
    </g>
    
    <g transform="translate(850, 50)">
      <text x="0" y="0" class="text" fill="#e74c3c" font-weight="bold">⚠ CRITICAL:</text>
      <text x="0" y="20" class="text" fill="#e74c3c">Use TLC555 CMOS</text>
      <text x="0" y="40" class="text" fill="#e74c3c">NOT NE555 bipolar</text>
      <text x="0" y="60" class="text" fill="#555">(60yr vs 35day battery)</text>
    </g>
  </g>
</svg>
