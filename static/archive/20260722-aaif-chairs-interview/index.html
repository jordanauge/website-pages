19:30.164Z\"},\"featuredBlog\":{\"id\":5221,\"title\":\"The second axis of scale: A case for distributed artificial superintelligence\",\"createdAt\":\"2026-02-25T20:51:23.652Z\",\"updatedAt\":\"2026-04-08T21:04:35.740Z\",\"publishedAt\":\"2026-04-08T21:04:39.077Z\",\"locale\":\"en\",\"publishDate\":\"2026-02-25T00:00:00.000Z\",\"key\":\"the-second-axis-of-scale\",\"AGNTCY_component\":null,\"documentId\":\"him9x8et6zs2utmc2jnr0vkl\",\"IoC_blog\":true,\"articleSummary\":\"- **Scaling AI: Beyond vertical growth** - The history of computing shows that scale-up and scale-out together unlock greater innovation; AI must move from just vertical scaling to also scaling out distributed intelligence for fault tolerance, efficiency, and operability.\\n- **Inversion of control and semantic collaboration** - Shifting control to platform layers enables agents to supply intent while infrastructure manages the rest. Current AI agents connect syntactically, but true progress requires a semantic layer for shared intent, cumulative knowledge, and collective reasoning.\\n- **Internet of Cognition**: The path forward - Distributed superintelligence emerges from agents and humans reasoning together via shared protocols, knowledge fabrics, and cognition engines-ushering in the [Internet of Cognition](https://outshift.cisco.com/internet-of-cognition/whitepaper).\",\"isExternal\":null,\"externalUrl\":null,\"blog_authors\":[{\"id\":1476,\"Name\":\"Vijoy Pandey\",\"createdAt\":\"2023-11-10T08:21:08.659Z\",\"updatedAt\":\"2025-12-23T06:56:13.619Z\",\"publishedAt\":\"2025-12-23T06:56:14.704Z\",\"locale\":\"en\",\"jobTitle\":\"Senior Vice President of Outshift by Cisco\",\"description\":null,\"documentId\":\"v22ndrko094o2w62mc5f137v\",\"key\":\"vijoy-pandey\",\"Avatar\":{\"id\":6347,\"name\":\"vijoy.jpg\",\"alternativeText\":null,\"caption\":null,\"width\":315,\"height\":420,\"formats\":{\"thumbnail\":{\"ext\":\".jpg\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbna tedAt\":\"2026-06-24T15:34:08.882Z\",\"updatedAt\":\"2026-06-29T11:36:44.023Z\",\"publishedAt\":\"2026-06-29T11:36:44.130Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T18:00:00.000Z\",\"key\":\"continuous-agentic-semantic-authorization-for-mas\",\"AGNTCY_component\":null,\"documentId\":\"pty4948njeabnr63lx032rxn\",\"IoC_blog\":true,\"articleSummary\":\"- Continuous Agent Semantic Authorization (CASA) enables agent collaboration by providing intent-scoped authorization and continuous enforcement for multi-agent systems. \\n- Traditional authorization verifies identity and permissions but loses visibility into why an action is performed, creating an intent gap that authenticated, authorized actions can still violate. \\n- CASA closes that gap with five core capabilities: semantic intent parsing, task-based authorization, ephemeral authorization, delegation lineage tracking, and continuous semantic enforcement. \\n- Enforcement runs through lightweight sidecars and an eBPF-based network layer managed by the CASA runtime, with policies defined as Kubernetes CRDs, so you can deploy CASA without modifying application code or adding SDKs. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}},{\"id\":5318,\"title\":\"Mycelium: Coordination Layer for Multi-Agent Systems\",\"createdAt\":\"2026-06-24T19:35:13.974Z\",\"updatedAt\":\"2026-07-01T09:01:44.328Z\",\"publishedAt\":\"2026-07-01T09:01:44.451Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T17:00:00.000Z\",\"key\":\"mycelium-coordination-layer-for-multi-agent-systems\",\"AGNTCY_component\":null,\"documentId\":\"rxgwvsg7bf6p54co7ohral6k\",\"IoC_blog\":false,\"articleSummary\":\"- Multi-agent systems often produce \\\"AI theater,\\\" where agents generate output but never converge on a decision; Mycelium adds shared memory and a structured negotiation layer so agents can think together. \\n- A \\\"room\\\" gives agents persistent, searchable memory (Markdown files dual-indexed into pgvector and AgensGraph), so what one agent learns, every agent inherits across sessions. \\n- A Cognition Engine mediates structured negotiation, agents propose, counter, and converge through a protocol rather than free-chatting, and consensus compiles into a shared, executable plan. \\n- In a 14 decision scenarios test, mediated negotiations reached a decision 93% of the time versus 36% for unstructured chat, and on the five hardest scenarios, unstructured chat reached zero decisions. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":75,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newslett ed cognitive frameworks and isolation. \\n- The [Internet of Cognition](https://outshift.cisco.com/internet-of-cognition) (IoC) architecture solves this by equipping distributed agents with shared intent, shared context, and shared reasoning. \\n- An interactive Explore experience provides tangible, real-world scenarios—such as software crisis management and healthcare coordination—to demonstrate how IoC resolves complex agent deadlocks. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\",\"icon\":{\"id\":863525,\"name\":\"Black.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"Black\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":0.96,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Black.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-01-30T20:12:36.154Z\",\"updatedAt\":\"2025-01-30T20:12:36.154Z\",\"documentId\":\"nztec76i90n36sew1t2doso4\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":996957,\"name\":\"CREA-1603 AOP New Use Cases_AIML.png\",\"alternativeText\":null,\"caption\":null,\"width\":3840,\"height\":2160,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_CREA_1603_AOP_New_Use_Cases_AIML_706153c4a9.png\",\"etag\":\"46ced48152bd95dc5257ad1495bfc073\",\"hash\":\"thumbnail_CREA_1603_AOP_New_Use_Cases_AIML_706153c4a9\",\"mime\":\"image/png\",\"nam n- Quantum networking matters because it unlocks physics-based security and the ability to solve problems that sit beyond the reach of classical systems. \\n- Progress is real but early, with qubit stability, entanglement distribution, and infrastructure scale remaining key barriers to widespread deployment. \\n- Leaders who take the initiative to understand and harness this emerging technology will be best positioned to shape and benefit from what will redefine secure communications and competitive advantage for decades to come. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":44,\"title\":\"Quantum\",\"createdAt\":\"2025-02-03T03:04:15.388Z\",\"updatedAt\":\"2025-12-23T06:47:01.134Z\",\"publishedAt\":\"2025-12-23T06:47:02.476Z\",\"locale\":\"en\",\"description\":\"Uncover how quantum computing is paving the way for immense benefits with unprecedented computational power and real-world impact.\",\"hidden\":false,\"key\":\"quantum\",\"documentId\":\"pe4dpog46v1h2p5195iqpnys\"}},{\"id\":5215,\"title\":\"AI vs. ASI:  Understanding the future of artificial superintelligence\",\"createdAt\":\"2026-03-17T10:39:35.693Z\",\"updatedAt\":\"2026-04-08T19:51:37.081Z\",\"publishedAt\":\"2026-04-08T19:51:41.464Z\",\"locale\":\"en\",\"publishDate\":\"2026-03-17T15:00:00.000Z\",\"key\":\"ai-asi-future-of-artificial-superintelligence\",\"AGNTCY_component\":null,\"documentId\":\"stise4i5wyehq4efnt69o0ed\",\"IoC_blog\":false,\"articleSummary\":\"- AI agents are highly capable within specific tasks, they suffer from \\\"semantic isolation,\\\" meaning they cannot easily share knowledge or coordinate on complex, multi-step goals \\n- Artificial superintelligence (ASI) is achieved when systems of autonomous agents reach \\\"economic viability\\\"—performing 100% of human tasks without intervention—and \\\"technical viability,\\\" where reasoning engines can invent novel solutions beyond their original training data. \\n- To achieve true ASI, Outshift proposes an arc edTitle\":\"Editor’s pick from the blog\",\"horizontalLayout\":true,\"bannerTitle\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Get \",\"type\":\"text\"},{\"bold\":true,\"text\":\"more\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"insights\",\"type\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":null,\"menu1Title\":\"Case studies\",\"menu2Title\":null,\"menu3Title\":null,\"menu1External\":false,\"menu2External\":false,\"menu3External\":false,\"featuredCard\":[],\"featuredBlogs\":[{\"id\":5212,\"title\":\"Webex integrates AGNTCY Directory and Identity to power trusted onboarding, discovery, and verification of agentic apps   \",\"createdAt\":\"2026-03-09T19:26:59.274Z\",\"updatedAt\":\"2026-04-08T19:43:58.918Z\",\"publishedAt\":\"2026-04-08T19:44:02.887Z\",\"locale\":\"en\",\"publishDate\":\"2026-03-10T00:00:00.000Z\",\"key\":\"webex-integrates-agntcy-directory-and-identity\",\"AGNTCY_component\":null,\"documentId\":\"e9bqm9v1ym7pw9qqy1ffo3e1\",\"IoC_blog\":false,\"articleSummary\":\"- Webex has integrated AGNTCY Directory and Identity into its Agent Central Service (ACS), enabling trusted onboarding, secure discovery, and verified communication for AI and agentic applications across the Webex ecosystem. \\n- This integration establishes a unified governance and security layer for multi-agent systems, supporting interoperable AI agents built on open standards like MCP, A2A, and AGNTCY protocols, and strengthening enterprise-grade trust and compliance. \\n- Developers can now register, verify, and publish agentic servers through the Webex Developer Portal and App Hub, with enterprise provisioning, policy enforcement, and lifecycle controls managed centrally through Webex Control Hub. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}},{\"id\":5053,\"title\":\"Swisscom and Outshift team up to build agentic AI-enabled networks\",\"createdAt\":\"2025-04-10T20:02:45.856Z\",\"updatedAt\":\"2026-03-13T11:15:06.184Z\",\"publishedAt\":\"2026-03-13T11:15:08.427Z\",\"locale\":\"en\",\"publishDate\":\"2025-04-24T16:00:00.000Z\",\"key\":\"outshift-swisscom-agentic-ai-networks\",\"AGNTCY_component\":null,\"documentId\":\"n40b2ibd1ba9ut9xd234xwtf\",\"IoC_blog\":null,\"articleSummary\":null,\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":40,\"title\":\"Inside Outshift\",\"createdAt\":\"2023-12-21T14:26:04.911Z\",\"updatedAt\":\"2025-12-23T06:47:00.795Z\",\"publishedAt\":\"2025-12-23T06:47:02.077Z\",\"locale\":\"en\",\"description\":\"Learn what makes our tech tick — our team! Dive into behind the scenes happenings at Outshift and Cisco.\",\"hidden\":false,\"key\":\"inside-outshift\",\"documentId\":\"bhm2x3u3x8jsxrfu5zadbr17\"}}],\"CTA\":{\"id\":79,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[],\"menu1Items\":[{\"id\":971,\"text\":\"View all\",\"url\":\"/case-studies\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"},{\"id\":972,\"text\":\"WebEx Integration\",\"url\":\"/case-studies/webex-agntcy-directory-identity\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"},{\"id\":973,\"text\":\"Swisscom Integration\",\"url\":\"/case-studies/swisscom-agentic-ai-network-reliability\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"}],\"bannerBtn\":{\"id\":2395,\"url\":\"/blog\",\"cta\":null,\"variant\":\"icon\",\"external\":null,\"icon\":null},\"bannerImg\":null,\"blog_category\":null}],\"eyeBrowLink\":{\"id\":962,\"text\":\"Resources\",\"url\":\"/resources\",\"eyebrow\":\"NEW\",\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null}}]\n"])</script><script>self.__next_f.push([1,"10:[\"$\",\"$L27\",null,{\"logo\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/outshift-logo-text-white.svg\",\"NavDropdowns\":[{\"id\":76,\"title\":\"Initiatives\",\"featuredTitle\":\"Recent blog posts\",\"horizontalLayout\":true,\"bannerTitle\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Get \",\"type\":\"text\"},{\"bold\":true,\"text\":\"more\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"insights\",\"type\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"\",\"type\":\"text\"}]}],\"menu1Title\":\"Our Work\",\"menu2Title\":\"Our Collaborators\",\"menu3Title\":null,\"menu1External\":false,\"menu2External\":true,\"menu3External\":null,\"featuredCard\":[],\"featuredBlogs\":[{\"id\":5311,\"title\":\"Continuous Agent Semantic Authorization (CASA) for Multi-Agent Systems \",\"createdAt\":\"2026-06-24T15:34:08.882Z\",\"updatedAt\":\"2026-06-29T11:36:44.023Z\",\"publishedAt\":\"2026-06-29T11:36:44.130Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T18:00:00.000Z\",\"key\":\"continuous-agentic-semantic-authorization-for-mas\",\"AGNTCY_component\":null,\"documentId\":\"pty4948njeabnr63lx032rxn\",\"IoC_blog\":true,\"articleSummary\":\"- Continuous Agent Semantic Authorization (CASA) enables agent collaboration by providing intent-scoped authorization and continuous enforcement for multi-agent systems. \\n- Traditional authorization verifies identity and permissions but loses visibility into why an action is performed, creating an intent gap that authenticated, authorized actions can still violate. \\n- CASA closes that gap with five core capabilities: semantic intent parsing, task-based authorization, ephemeral authorization, delegation lineage tracking, and continuous semantic enforcement. \\n- Enforcement runs through lightweight sidecars and an eBPF-based network layer managed by the CASA runtime, with policies defined as Kubernetes CRDs, so you can deploy CASA without modifying application code or adding SDKs. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}},{\"id\":5318,\"title\":\"Mycelium: Coordination Layer for Multi-Agent Systems\",\"createdAt\":\"2026-06-24T19:35:13.974Z\",\"updatedAt\":\"2026-07-01T09:01:44.328Z\",\"publishedAt\":\"2026-07-01T09:01:44.451Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T17:00:00.000Z\",\"key\":\"mycelium-coordination-layer-for-multi-agent-systems\",\"AGNTCY_component\":null,\"documentId\":\"rxgwvsg7bf6p54co7ohral6k\",\"IoC_blog\":false,\"articleSummary\":\"- Multi-agent systems often produce \\\"AI theater,\\\" where agents generate output but never converge on a decision; Mycelium adds shared memory and a structured negotiation layer so agents can think together. \\n- A \\\"room\\\" gives agents persistent, searchable memory (Markdown files dual-indexed into pgvector and AgensGraph), so what one agent learns, every agent inherits across sessions. \\n- A Cognition Engine mediates structured negotiation, agents propose, counter, and converge through a protocol rather than free-chatting, and consensus compiles into a shared, executable plan. \\n- In a 14 decision scenarios test, mediated negotiations reached a decision 93% of the time versus 36% for unstructured chat, and on the five hardest scenarios, unstructured chat reached zero decisions. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":75,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[{\"id\":974,\"text\":\"DevNet\",\"url\":\"https://developer.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":{\"location\":\"navigation\",\"link_label\":\"DevNet\",\"location_detail\":\"right\",\"resource_interaction\":\"visit to DevNet initiative page\"},\"su 2959\",\"static/chunks/2959-abaea82e44b56d3c.js\",\"515\",\"static/chunks/515-237a56a3d8fb3b97.js\",\"709\",\"static/chunks/709-7728f843509b22bf.js\",\"8405\",\"static/chunks/app/(public)/blog/%5Bcategory_slug%5D/%5Bslug%5D/page-1d5bcb9860035bb3.js\"],\"BlogProgressBar\"]\n"])</script><script>self.__next_f.push([1,"4d:I[67436,[\"9066\",\"static/chunks/dc112a36-ee92aa0ad18635c3.js\",\"5105\",\"static/chunks/0e5ce63c-cbc77bead7e98114.js\",\"7349\",\"static/chunks/7349-eee887fd74d7d637.js\",\"2619\",\"static/chunks/2619-e6cb6cc2572e4af5.js\",\"1356\",\"static/chunks/1356-07550e7c3e4eeb4e.js\",\"3640\",\"static/chunks/3640-e0a22cc8b1aefe0c.js\",\"8509\",\"static/chunks/8509-d708f7a29c32ee96.js\",\"1771\",\"static/chunks/1771-6c1a816c2562b805.js\",\"8977\",\"static/chunks/8977-e829cddf4fddb9df.js\",\"3927\",\"static/chunks/3927-9a0df272f0550e06.js\",\"2442\",\"static/chunks/2442-b1ec3294691976dc.js\",\"7386\",\"static/chunks/7386-5a9c6da37315c9a2.js\",\"9606\",\"static/chunks/9606-e134296603017457.js\",\"5460\",\"static/chunks/5460-39fbb996cda8d85b.js\",\"8072\",\"static/chunks/8072-37c71832f1dcac07.js\",\"8029\",\"static/chunks/8029-78435259b3a78450.js\",\"7436\",\"static/chunks/7436-a6cef60453c8f2e7.js\",\"335\",\"static/chunks/335-2a54d96291f8088f.js\",\"6687\",\"static/chunks/6687-9234778941533c6b.js\",\"1736\",\"static/chunks/1736-49e383d19dbad77f.js\",\"2959\",\"static/chunks/2959-abaea82e44b56d3c.js\",\"515\",\"static/chunks/515-237a56a3d8fb3b97.js\",\"709\",\"static/chunks/709-7728f843509b22bf.js\",\"8405\",\"static/chunks/app/(public)/blog/%5Bcategory_slug%5D/%5Bslug%5D/page-1d5bcb9860035bb3.js\"],\"BlogTrackers\"]\n"])</script><script>self.__next_f.push([1,"4e:T2eeb,"])</script><script>self.__next_f.push([1,"\u003cp\u003eBuilding in the open is a central element to the work we do at Outshift. The Cisco Open Source Program Office team operates within Outshift’s charter. Outshift engineers and team members spearhead or support multiple projects as part of the Linux Foundation: From founding members and visionaries of AGNTCY, to serving on the Agent2Agent(A2A) steering committee, and chairing multiple Agentic AI Foundation (AAIF) working groups.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe recently caught up with Jordan Augé and Pavan Sudheendra, two Outshift engineers representing Cisco as chairs of the Agentic AI Foundation's (AAIF) Observability and Traceability working group and the Accuracy and Reliability working group. We wanted to hear about their passion for open source, their work at Outshift, and what we can look forward to from them over the coming year.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003eWhy is open source important to you? Is there anything especially important with open source software in AI?\u0026nbsp;\u003c/h3\u003e\u003cp\u003e\u003cstrong\u003eJordan:\u003c/strong\u003e\u003ci\u003e\u003cstrong\u003e \u003c/strong\u003eMy relationship with open source goes back before it was a career move. I was a quiet supporter of open source advocacy groups like APRIL and FSF France, learned by using open source heavily, and spent years coding in the open simply as a hobby.  \u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eFor agentic AI specifically, no single team can figure this out alone. The field is evolving too fast, and fundamental pieces are still missing: evaluation methods, reliability standards, interoperability protocols. The community needs to move together, and that requires sharing. AAIF is precisely that, and participating in IRTF and IETF working groups on networking years ago showed me how well that model can work.\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003eWhy are you passionate about solving hard problems? How is this different in an Open source approach vs closed source?\u0026nbsp;\u003c/h3\u003e\u003cp\u003e\u003cstrong\u003ePavan:\u003c/strong\u003e\u003ci\u003e I enjoy working on problems where the industry hasn’t settled on the abstractions yet. That’s usually where the most meaningful infrastructure gets built. Agent systems today feel a lot like early cloud native or distributed systems eras—lots of innovation, but still missing common operational models and standards.\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eOpen source changes the optimization function. In closed systems, you optimize for product advantage. In OSS, you optimize for shared semantics, interoperability, and long-term ecosystem health.\u0026nbsp;\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eJordan:\u003c/strong\u003e\u003ci\u003e Working on a hard problem in the open fundamentally changes the dynamic: the problem gets better defined, the solution gets more robust, and the result reaches further, because more people are invested in all three. Where closed-source work stays within one team, open source work on the same problem can move an entire field.\u003c/i\u003e\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1412/828;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/aaif-chairs-interview/1783369297257_mjx371t2p3a_Jordan_Auge_Quote_AAIF_Interview_caaad75bc3.png\" width=\"1412\" height=\"828\"\u003e\u003c/figure\u003e\u003ch3\u003eWhat are 3 things you wish people knew about your AAIF working group? What are you most excited about right now?\u0026nbsp;\u003c/h3\u003e\u003cp\u003e\u003cstrong\u003eJordan:\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003ci\u003e\u003cstrong\u003ePragmatic, but not shallow.\u003c/strong\u003e Our job is to surface real signal from the noise. We want outputs that are usable from day one and grounded in the research literature, not just the current hype cycle.\u003c/i\u003e\u0026nbsp;\u003c/li\u003e\u003cli\u003e\u003ci\u003e\u003cstrong\u003eThe shift we are addressing is fundamental.\u003c/strong\u003e Moving from deterministic systems, where you could trace every decision and reason about behavior formally, to agentic systems where an LLM is calling the shots opens up entirely new dimensions of failure. You need to detect, measure, prevent, and control them. And there is decades of rigorous work in distributed systems on consistency, fault tolerance, observability—directly applicable here. We do not need to reinvent it; we need to adapt it and make it accessible.\u003c/i\u003e\u0026nbsp;\u003c/li\u003e\u003cli\u003e\u003ci\u003e\u003cstrong\u003eThis work comes from real experience.\u003c/strong\u003e Pavan and I come from different projects but hit the same wall. In my case, building a network change management system while simultaneously trying to ship to production, evaluate it for a scientific paper, and keep up with a fast-moving stack meant those goals pulled in opposite directions constantly. Failure modes were hard to reproduce, nothing was reusable, each dependency update broke something else. The most hyped tools were often the least reproducible. Engineering credibility and virality are not the same thing, and the field sometimes forgets that. These problems are not solved yet.\u003c/i\u003e\u0026nbsp;\u003cbr\u003e\u003ci\u003eThat tension is exactly why \u003c/i\u003e\u003ca href=\"https://outshift-open.github.io/mas-lab/blog/2026/06/17/v0-1-release/\"\u003e\u003ci\u003e\u003cu\u003ewe released MAS-Lab\u003c/u\u003e\u003c/i\u003e\u003c/a\u003e\u003ci\u003e as an \u003c/i\u003e\u003ca href=\"https://github.com/outshift-open/mas-lab\"\u003e\u003ci\u003e\u003cu\u003eopen source project\u003c/u\u003e\u003c/i\u003e\u003c/a\u003e\u003ci\u003e alongside its \u003c/i\u003e\u003ca href=\"https://arxiv.org/abs/2606.30546\"\u003e\u003ci\u003e\u003cu\u003eresearch paper\u003c/u\u003e\u003c/i\u003e\u003c/a\u003e\u003ci\u003e: a versioned workflow specification, controlled runtime, and repeatable labs so intent, execution, and evidence stay aligned from demo to production, with observability, reliability, and control\u0026nbsp;baked in from the start. It is a concrete example of what we think the field needs more of—and what AAIF working groups are working toward: not whitepapers in isolation, but paper\u0026nbsp;and code\u0026nbsp;moving together. We are\u0026nbsp;actively using this tool internally as a foundation to research and address silent \u003c/i\u003e\u003ca href=\"https://outshift.cisco.com/internet-of-cognition\"\u003e\u003ci\u003e\u003cu\u003ecognitive failures\u003c/u\u003e\u003c/i\u003e\u003c/a\u003e\u003ci\u003e that affect the outcomes of agentic systems.\u0026nbsp;Pavan chairs Observability and Traceability, and I chair Accuracy and Reliability. With agentic systems, observability has to go deeper than ever before, all the way into the LLM reasoning. You cannot reconstruct after the fact why a decision was made; you need to see it actually happen. Observability cannot be best-effort in these systems—it needs to be baked in from the start, alongside full interoperability.\u003c/i\u003e\u0026nbsp;\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cstrong\u003ePavan: \u003c/strong\u003e\u003ci\u003eWhat excites me most right now is multi-agent observability— especially around orchestration, agent coordination, memory/state visibility, and reasoning telemetry. I think that becomes a critical layer for production AI systems very quickly.\u0026nbsp;\u0026nbsp;\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u003ci\u003eModern observability tells us what an agent did and when. The next frontier is understanding why it chose one course of action over another, how context and memory influenced that decision, and how multiple agents coordinate over time. That means instrumenting orchestration, delegation, memory, state transitions, and reasoning—not just API calls.\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eOpen-source efforts like \u003c/i\u003e\u003ca href=\"https://github.com/outshift-open/insightclaw\"\u003e\u003ci\u003e\u003cu\u003eInsightClaw\u003c/u\u003e\u003c/i\u003e\u003c/a\u003e\u003ci\u003e are demonstrating what this looks like in practice by instrumenting agentic workflows and surfacing telemetry that traditional observability stacks simply weren't designed to capture. Those implementation experiences are incredibly valuable for AAIF because they help ensure the standards we're developing are grounded in real production challenges rather than hypothetical ones. I'm excited about helping define the common language and telemetry model that allows these capabilities to work consistently across frameworks and vendors.\u003c/i\u003e\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1412/828;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/aaif-chairs-interview/1783369339222_lpaggdt65u_Pavan_Sudheendra_Quote_AAIF_Interview_a9ca0ae49b.png\" width=\"1412\" height=\"828\"\u003e\u003c/figure\u003e\u003ch3\u003eWhat does success look like for your working group in the next year?\u0026nbsp;\u003c/h3\u003e\u003cp\u003e\u003cstrong\u003ePavan:\u003c/strong\u003e\u003ci\u003e Success is seeing multiple ecosystems adopt common semantic conventions for agent execution, orchestration, memory, and reasoning events. If developers can debug heterogeneous agent systems in an easier way without custom glue for every framework, we’ve done something useful.\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eJordan: \u003c/strong\u003e\u003ci\u003eSuccess starts with making real progress on the hardest part: understanding the failure space. Agentic systems fail in ways that are still poorly mapped. The working group needs to establish shared language around what the boundaries are, what can go wrong, and how to detect, measure, and prevent it. Getting the broader community aligned around that framing (integrating contributions from research, from open source, and from teams running these systems in production) is itself a significant achievement.\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eWe are at one of those rare moments where the foundations of a field are still taking shape. AAIF is where we forge them in the open, not to produce whitepapers, but to deliver answers that actually change how people build, test, and operate these systems. That requires bringing together everyone with real skin in the game: people who built these systems, who operate them in production, who use them at scale for their own needs and their customers'. High standards, real consensus, genuine adoption — that is the ambition.\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003eHow does our work with AGNTCY overlap with AAIF?\u0026nbsp;\u003c/h3\u003e\u003cp\u003e\u003cstrong\u003eJordan: \u003c/strong\u003e\u003ci\u003eAGNTCY is Cisco/Outshift's open source contribution to the infrastructure layer: agent identity, discovery, interoperability protocols. Making agents composable and connectable.\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eAAIF's Accuracy \u0026amp; Reliability working group covers the quality layer: once agents are running and interoperating, how do you know they are doing the right thing? The two are complementary.\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePavan:\u003c/strong\u003e\u003ci\u003e The overlap is strong around interoperability and standardization for agentic systems. AGNTCY is helping define how agents can discover, communicate, and collaborate across ecosystems, while AAIF is focused on making those interactions observable and operationally understandable.\u0026nbsp;\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eIn practice, both efforts care about shared semantics— things like agent identity, context propagation, tool execution, orchestration flows, and cross-agent coordination. I see them as complementary layers of the same emerging stack.\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003eAny advice for other working group chairs or OSS collaborators?\u0026nbsp;\u003c/h3\u003e\u003cp\u003e\u003cstrong\u003eJordan:\u0026nbsp;\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ci\u003e\u003cstrong\u003eOwn something.\u003c/strong\u003e A working group moves when someone takes personal responsibility for a piece, such as a problem, a section, or a deliverable. You do not need to be present for everything; you need to be the person who never lets their part drop.\u003c/i\u003e\u0026nbsp;\u003c/li\u003e\u003cli\u003e\u003ci\u003e\u003cstrong\u003eStay curious about what is missing and how you would want it to work\u003c/strong\u003e, not just what already exists. The most valuable contributors bring those questions into the room before everyone else has them.\u003c/i\u003e\u0026nbsp;\u003c/li\u003e\u003cli\u003e\u003ci\u003e\u003cstrong\u003eFocused expertise matters more than full-time availability.\u003c/strong\u003e A few hours of sharp, specific input can unblock something a generalist could not resolve in a week. Do not let 'I cannot dedicate fully' stop you—find the piece where your contribution is uniquely useful and own it.\u003c/i\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003ePavan:\u0026nbsp;\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003ci\u003eMove quickly—the AI ecosystem is evolving at an incredible pace. Invest early in aligning on terminology, because shared language makes collaboration dramatically easier. Most importantly, prioritize reference implementations alongside specifications. Standards only become meaningful when developers can instrument real systems, operators can use them in production, and multiple projects can interoperate around them.\u003c/i\u003e\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://aaif.io/working-groups/\"\u003eRead more about AAIF\u003c/a\u003e and \u003ca href=\"https://agntcy.org/\"\u003esee the latest developments with AGNTCY\u003c/a\u003e.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"14:[[\"$\",\"$L4b\",null,{}],\"$L4c\",[\"$\",\"$L4d\",null,{\"blogData\":{\"id\":5326,\"title\":\"Agentic AI Foundation Chairs discuss AGNTCY, AAIF, and building in the open\",\"createdAt\":\"2026-07-06T20:18:49.787Z\",\"updatedAt\":\"2026-07-07T15:07:24.171Z\",\"publishedAt\":\"2026-07-07T15:07:24.229Z\",\"locale\":\"en\",\"publishDate\":\"2026-07-07T14:00:00.000Z\",\"key\":\"aaif-chairs-interview\",\"AGNTCY_component\":null,\"documentId\":\"jnze10zdv7vmjc0rwnd8e6vx\",\"IoC_blog\":false,\"articleSummary\":\"- [Outshift by Cisco](https://outshift.cisco.com/) engineers Jordan Augé and Pavan Sudheendra serve as chairs of two Agentic AI Foundation (AAIF) working groups focused on accuracy and reliability and observability and traceability. \\n- Both engineers share why open source is essential for agentic AI, where no single team can solve the field's foundational challenges alone. \\n- The AAIF working groups aim to establish shared language around agent failure modes, multi-agent observability, and operational standards for production AI systems. \",\"isExternal\":false,\"externalUrl\":null,\"thumbnail\":{\"id\":997080,\"name\":\"Frame 19.png\",\"alternativeText\":null,\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_Frame_19_67a7d39b79.png\",\"etag\":\"a5f09f23cb48f1bc2d7a3e5c0871a286\",\"hash\":\"thumbnail_Frame_19_67a7d39b79\",\"mime\":\"image/png\",\"name\":\"thumbnail_Frame 19.png\",\"path\":null,\"size\":81.55,\"width\":245,\"height\":138,\"sizeInBytes\":81552}},\"hash\":\"Frame_19_67a7d39b79\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":1952.1,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Frame_19_67a7d39b79.png\",\"previewUrl\":null,\"provider\":\"aws-s edAt\":\"2025-02-03T20:20:10.285Z\",\"publishedAt\":\"2025-02-03T20:20:10.132Z\",\"locale\":\"en\",\"featuredOrder\":null,\"documentId\":\"v6fm22p6v21q36gkhjckg1ij\"}],\"blog_authors\":[{\"id\":1511,\"Name\":\"Luke Tucker\",\"createdAt\":\"2025-04-18T20:30:17.934Z\",\"updatedAt\":\"2025-12-23T06:56:17.000Z\",\"publishedAt\":\"2025-12-23T06:56:18.160Z\",\"locale\":\"en\",\"jobTitle\":\"Head of Outshift Developer Marketing\",\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Luke is a startup executive and entrepreneur. An inspirational speaker and leader, Luke is passionate about building communities and investing in mission-driven businesses. He helped build the HackerOne brand and hacker community to over 1.5 million users, paying them over $200 million dollars. He was an early executive at cloud security startup, Lightspin, serving as the VP Marketing. Lightspin was acquired by Cisco in June 2023 and Luke currently serves as Head of Outshift Developer Marketing at Cisco where he leads a team of creative and passionate open source community managers and cloud engineers building tools, content, and experiences to help drive growth and value for Cisco's open source projects, GenAI products, and agentic frameworks.\",\"type\":\"text\"}]}],\"documentId\":\"c616ldymm4mkfnqspf3ry26w\",\"key\":\"luke-tucker\",\"Avatar\":{\"id\":650550,\"name\":\"luke-headshot-square.png\",\"alternativeText\":null,\"caption\":null,\"width\":1080,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_luke-headshot-square.png\",\"hash\":\"thumbnail_luke-headshot-square\",\"mime\":\"image/png\",\"name\":\"thumbnail_luke-headshot-square.png\",\"path\":null,\"size\":44.38,\"width\":156,\"height\":156}},\"hash\":\"luke-headshot-square\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":316.63,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/luke-headshot-square.png\",\"previe
